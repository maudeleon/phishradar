name: PhishRadar — Recolección nocturna

on:
  schedule:
    - cron: '0 6 * * *'  # 2am Guatemala = 6am UTC
  workflow_dispatch:       # permite correrlo manualmente también

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recolectar URLs y actualizar modelo
        env:
          URLHAUS_AUTH_KEY: ${{ secrets.URLHAUS_AUTH_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python main.py
          python main.py --train
          python main.py --update

      - name: Guardar base de datos actualizada
        uses: actions/upload-artifact@v4
        with:
          name: phishradar-db
          path: data/phishradar.db
          retention-days: 7
